name: Build signed Android App Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed app bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies & verify
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing required Android signing repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_KEYSTORE_PASSWORD)."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/solville.keystore"

      - name: Build signed release app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/solville.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify release bundle signature
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          VERIFY_OUT=$(jarsigner -verify -verbose -certs "$AAB_PATH")
          echo "$VERIFY_OUT" | grep -E "jar verified|CN="
          if echo "$VERIFY_OUT" | grep -q "CN=Android Debug"; then
            echo "Error: Release bundle was signed with the Android Debug key instead of the release upload key."
            exit 1
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/solville.keystore"

      - name: Publish signed bundle to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_VERSION=$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml)
          VERSION_NAME="${FULL_VERSION%%+*}"
          VERSION_CODE="${FULL_VERSION##*+}"
          TAG="v${VERSION_NAME}-b${VERSION_CODE}"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          echo "Publishing release $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$AAB_PATH" --clobber
          else
            gh release create "$TAG" "$AAB_PATH" \
              --title "Solville v${VERSION_NAME} (Build ${VERSION_CODE})" \
              --notes "Signed release Android App Bundle for Google Play Store upload."
          fi

      - name: Upload signed app bundle artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: solville-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
